<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title">
<title id="title">Sai Vamshi’s project atlas. Four routes connect Search, Validate, Queue, and Redirect to the projects that use them.</title>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9bc0dd" opacity=".2"/></pattern>
  <linearGradient id="panel" x2="100%" y2="100%"><stop stop-color="#111f30"/><stop offset="1" stop-color="#070e19"/></linearGradient>
</defs>
<style>
  text { font-family: system-ui, sans-serif; }
  .mono { font-family: monospace; letter-spacing: 2px; }
  .signal { stroke-dasharray: 20 500; animation: route 9s linear infinite; }
  @keyframes route {
    0% { stroke-dashoffset: 20; opacity: 0; }
    9% { opacity: 1; }
    37% { stroke-dashoffset: -440; opacity: 1; }
    43%, 100% { stroke-dashoffset: -500; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .signal { display: none; animation: none; } }
</style>
<rect x="1" y="1" width="898" height="348" rx="22" fill="url(#panel)" stroke="#38516a"/>
<rect x="2" y="2" width="896" height="346" rx="21" fill="url(#grid)"/>
<text x="34" y="43" class="mono" font-size="21" fill="#80ead7">SAI VAMSHI / PROJECT ATLAS</text>
<text x="33" y="103" font-size="44" font-weight="700" fill="#f5f8ff">Follow an engineering decision</text>
<path d="M34 126H866" stroke="#32475b"/>
<g>
  <text x="35" y="173" class="mono" font-size="20" fill="#80ead7">01</text>
  <text x="87" y="173" class="mono" font-size="22" fill="#f5f8ff">SEARCH</text>
  <text x="243" y="173" font-size="22" fill="#bdcfe2">Find a similar incident</text>
  <path d="M596 165H849" stroke="#80ead7" stroke-opacity=".42" stroke-width="2"/>
  <path class="signal" style="animation-delay:-0s" d="M596 165H849" stroke="#80ead7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="596" cy="165" r="4" fill="#80ead7"/>
  <circle cx="849" cy="165" r="6" fill="#101d2d" stroke="#80ead7" stroke-width="2"/>
</g>
<g>
  <text x="35" y="223" class="mono" font-size="20" fill="#9fbbff">02</text>
  <text x="87" y="223" class="mono" font-size="22" fill="#f5f8ff">VALIDATE</text>
  <text x="243" y="223" font-size="22" fill="#bdcfe2">Handle an invalid reply</text>
  <path d="M596 215H849" stroke="#9fbbff" stroke-opacity=".42" stroke-width="2"/>
  <path class="signal" style="animation-delay:-1.6s" d="M596 215H849" stroke="#9fbbff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="596" cy="215" r="4" fill="#9fbbff"/>
  <circle cx="849" cy="215" r="6" fill="#101d2d" stroke="#9fbbff" stroke-width="2"/>
</g>
<g>
  <text x="35" y="273" class="mono" font-size="20" fill="#cbacff">03</text>
  <text x="87" y="273" class="mono" font-size="22" fill="#f5f8ff">QUEUE</text>
  <text x="243" y="273" font-size="22" fill="#bdcfe2">Run work in the background</text>
  <path d="M596 265H849" stroke="#cbacff" stroke-opacity=".42" stroke-width="2"/>
  <path class="signal" style="animation-delay:-3.2s" d="M596 265H849" stroke="#cbacff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="596" cy="265" r="4" fill="#cbacff"/>
  <circle cx="849" cy="265" r="6" fill="#101d2d" stroke="#cbacff" stroke-width="2"/>
</g>
<g>
  <text x="35" y="323" class="mono" font-size="20" fill="#ffd199">04</text>
  <text x="87" y="323" class="mono" font-size="22" fill="#f5f8ff">REDIRECT</text>
  <text x="243" y="323" font-size="22" fill="#bdcfe2">Update a printed QR code</text>
  <path d="M596 315H849" stroke="#ffd199" stroke-opacity=".42" stroke-width="2"/>
  <path class="signal" style="animation-delay:-4.8s" d="M596 315H849" stroke="#ffd199" stroke-width="4" stroke-linecap="round"/>
  <circle cx="596" cy="315" r="4" fill="#ffd199"/>
  <circle cx="849" cy="315" r="6" fill="#101d2d" stroke="#ffd199" stroke-width="2"/>
</g>
</svg>
