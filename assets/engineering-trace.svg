<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="title desc">
  <title id="title">Engineering trace · OpsSage AI</title>
  <desc id="desc">An animated signal travels from incident report to search, similar incidents, and a suggested next step.</desc>
  <defs>
    <linearGradient id="panel" x2="100%" y2="100%">
      <stop stop-color="#0a1321"/>
      <stop offset="1" stop-color="#101d30"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9fb8d4" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <style>
    text { font-family: ui-monospace, Consolas, monospace; }
    .signal { animation: travel 7s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      8% { transform: translateX(0); opacity: 1; }
      27%, 34% { transform: translateX(215px); opacity: 1; }
      53%, 60% { transform: translateX(430px); opacity: 1; }
      80%, 91% { transform: translateX(645px); opacity: 1; }
      100% { transform: translateX(645px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; display: none; }
    }
  </style>
  <rect x="1" y="1" width="878" height="288" rx="22" fill="url(#panel)" stroke="#30445b"/>
  <rect x="2" y="2" width="876" height="286" rx="21" fill="url(#grid)"/>
  <path d="M36 60H844" stroke="#30445b"/>
  <text x="38" y="39" fill="#89f4d4" font-size="19" letter-spacing="2">ENGINEERING TRACE</text>
  <text x="842" y="39" fill="#b0c6df" font-size="19" text-anchor="end">OPSSAGE AI</text>
  <text x="38" y="113" fill="#f2f7ff" font-size="38" font-weight="700">From alert to next action</text>
  <path d="M116 179H761" stroke="#5acaad" stroke-width="2"/>
  <g fill="#101d30" stroke="#89f4d4" stroke-width="2">
    <circle cx="116" cy="179" r="7"/>
    <circle cx="331" cy="179" r="7"/>
    <circle cx="546" cy="179" r="7"/>
    <circle cx="761" cy="179" r="7"/>
  </g>
  <g class="signal">
    <circle cx="116" cy="179" r="18" fill="#89f4d4" opacity=".16"/>
    <circle cx="116" cy="179" r="7" fill="#d2fff0"/>
  </g>
  <g fill="#f2f7ff" font-size="22" text-anchor="middle">
    <text x="116" y="226">Incident</text>
    <text x="331" y="226">Search</text>
    <text x="546" y="226">Similar cases</text>
    <text x="761" y="226">Next step</text>
  </g>
  <g fill="#b0c6df" font-size="17" text-anchor="middle">
    <text x="116" y="253">Report arrives</text>
    <text x="331" y="253">Match descriptions</text>
    <text x="546" y="253">Surface history</text>
    <text x="761" y="253">Review guidance</text>
  </g>
</svg>
